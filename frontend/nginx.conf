server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ВКЛЮЧАЕМ СЖАТИЕ
  gzip on;
  gzip_min_length 1024;
  gzip_types text/html text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # КЭШ ДЛЯ СТАТИКИ (если будут css/js/картинки)
  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=86400, immutable";
    try_files $uri =404;
  }

  # Корень — без кэша (чтобы сразу видеть правки)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html =404;
  }
}

