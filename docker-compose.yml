# docker compose v2 (без поля version)

networks:
  app-net: {}
  nginx-proxy:
    external: true   # уже создана вместе с nginx-proxy + acme-companion

volumes:
  pgdata: {}

services:
  db:
    image: postgres:16-alpine
    container_name: myapp-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myapp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: api.bizleosal.ru
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: api.bizleosal.ru
      LETSENCRYPT_EMAIL: "${LE_EMAIL}"   # добавьте LE_EMAIL в .env
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: UTF-8
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"   # порт виден только nginx-proxy в общей сети
    networks:
      - app-net
      - nginx-proxy
    healthcheck:
      # Однострочный Python-пинг эндпоинта здоровья
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status==200 else sys.exit(1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  landing:
    image: nginx:alpine
    container_name: myapp-landing
    restart: unless-stopped
    volumes:
      - ./landing:/usr/share/nginx/html:ro
    environment:
      VIRTUAL_HOST: bizleosal.ru,www.bizleosal.ru
      LETSENCRYPT_HOST: bizleosal.ru,www.bizleosal.ru
      LETSENCRYPT_EMAIL: "${LE_EMAIL}"
      VIRTUAL_PORT: "80"
    networks:
      - nginx-proxy
    # healthcheck для статики не обязателен

  frontend:
    image: nginx:alpine
    container_name: myapp-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VIRTUAL_HOST: app.bizleosal.ru
      LETSENCRYPT_HOST: app.bizleosal.ru
      LETSENCRYPT_EMAIL: "${LE_EMAIL}"
      VIRTUAL_PORT: "80"
    networks:
      - nginx-proxy

